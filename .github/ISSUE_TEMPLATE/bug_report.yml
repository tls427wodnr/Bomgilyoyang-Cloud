name: 버그 리포트
description: 재현 가능한 오류나 예상과 다른 동작을 제보합니다.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        제보해 주셔서 감사합니다. 문제를 빠르게 확인할 수 있도록 아래 내용을 작성해 주세요.

  - type: textarea
    id: description
    attributes:
      label: 문제 설명
      description: 어떤 문제가 발생했는지 명확하고 간결하게 설명해 주세요.
      placeholder: 문제가 발생한 상황과 증상을 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법
      description: 문제를 다시 발생시킬 수 있는 단계를 순서대로 작성해 주세요.
      placeholder: |
        1. ... 페이지로 이동합니다.
        2. ... 버튼을 클릭합니다.
        3. ... 오류가 발생합니다.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
      description: 정상이라면 어떻게 동작해야 하는지 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      description: 실제로 확인한 결과와 오류 메시지를 작성해 주세요.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 관련 영역
      options:
        - 프런트엔드
        - 백엔드
        - 프런트엔드와 백엔드 모두
        - 기타 또는 알 수 없음
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 실행 환경
      description: OS, 브라우저 및 버전, 기기 등 문제와 관련된 환경을 작성해 주세요.
      placeholder: 예) Windows 11 / Chrome 140 / 데스크톱
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 로그 및 첨부 자료
      description: 관련 로그, 스크린샷, 영상 등이 있다면 첨부해 주세요. 비밀번호나 API 키 등 민감 정보는 제거해 주세요.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: 추가 정보
      description: 문제 파악에 도움이 될 만한 다른 내용이 있다면 작성해 주세요.

  - type: checkboxes
    id: checks
    attributes:
      label: 확인 사항
      options:
        - label: 동일한 이슈가 이미 등록되어 있는지 검색했습니다.
          required: true
        - label: 로그와 첨부 자료에서 민감 정보를 제거했습니다.
          required: true

