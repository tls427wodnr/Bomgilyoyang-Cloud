name: 기능 제안
description: 새로운 기능이나 기존 기능의 개선을 제안합니다.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        더 나은 늘봄길을 위한 제안을 환영합니다. 해결하려는 문제와 기대 효과를 중심으로 작성해 주세요.

  - type: textarea
    id: problem
    attributes:
      label: 제안 배경
      description: 현재 어떤 불편이나 문제가 있는지 설명해 주세요.
      placeholder: 어떤 상황에서 누구에게 문제가 발생하는지 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 제안 내용
      description: 원하는 기능이나 개선 방향을 구체적으로 설명해 주세요.
    validations:
      required: true

  - type: textarea
    id: benefit
    attributes:
      label: 기대 효과
      description: 이 제안이 사용자나 프로젝트에 어떤 도움을 주는지 작성해 주세요.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 관련 영역
      options:
        - 프런트엔드
        - 백엔드
        - 프런트엔드와 백엔드 모두
        - 기타 또는 알 수 없음
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안
      description: 다른 해결 방법이나 우회 방법을 검토했다면 작성해 주세요.

  - type: textarea
    id: additional
    attributes:
      label: 추가 정보
      description: 참고 링크, 화면 예시, 관련 이슈 등이 있다면 첨부해 주세요.

  - type: checkboxes
    id: checks
    attributes:
      label: 확인 사항
      options:
        - label: 동일하거나 유사한 제안이 이미 등록되어 있는지 검색했습니다.
          required: true

