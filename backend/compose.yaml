services:
  mysql:
    image: mysql:8.4
    container_name: neulbomgil-mysql
    restart: unless-stopped

    ports:
      - "3306:3306"

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      IDENTITY_DB_USERNAME: ${IDENTITY_DB_USERNAME:?IDENTITY_DB_USERNAME is required}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?IDENTITY_DB_PASSWORD is required}
      COMMUNITY_DB_USERNAME: ${COMMUNITY_DB_USERNAME:?COMMUNITY_DB_USERNAME is required}
      COMMUNITY_DB_PASSWORD: ${COMMUNITY_DB_PASSWORD:?COMMUNITY_DB_PASSWORD is required}
      CHAT_DB_USERNAME: ${CHAT_DB_USERNAME:?CHAT_DB_USERNAME is required}
      CHAT_DB_PASSWORD: ${CHAT_DB_PASSWORD:?CHAT_DB_PASSWORD is required}
      FACILITY_DB_USERNAME: ${FACILITY_DB_USERNAME:?FACILITY_DB_USERNAME is required}
      FACILITY_DB_PASSWORD: ${FACILITY_DB_PASSWORD:?FACILITY_DB_PASSWORD is required}
      FAVORITE_DB_USERNAME: ${FAVORITE_DB_USERNAME:?FAVORITE_DB_USERNAME is required}
      FAVORITE_DB_PASSWORD: ${FAVORITE_DB_PASSWORD:?FAVORITE_DB_PASSWORD is required}

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    container_name: neulbomgil-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

volumes:
  mysql-data:
  redis-data:
