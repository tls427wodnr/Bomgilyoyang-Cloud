file.upload-dir=uploads
spring.application.name=neulbomgil-backend
spring.config.import=optional:file:.env[.properties]
server.port=8088
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.url=jdbc:mysql://localhost:3306/neulbomgil?characterEncoding=UTF-8&serverTimezone=UTC
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database=mysql
logging.level.org.hibernate=info
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
vworld.api.key=${API_KEY}
# SQL 로그
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.orm.jdbc.bind=TRACE
#spring.jpa.properties.hibernate.use_sql_comments=true
# JWT 설정
application.security.jwt.secret=${JWT_SECRET}
application.security.jwt.access-token-expiration=1800000
application.security.jwt.refresh-token-expiration=604800000
application.security.cookie.secure=${COOKIE_SECURE:false}
# 카카오 지도 API 설정
kakao.map.api-key=${KAKAO_MAP_API_KEY}
