file.upload-dir=uploads
spring.application.name=neulbomgil-backend
spring.config.import=optional:file:.env[.properties]
server.port=8088
# 모듈별 DataSource 설정
app.datasource.identity.driver-class-name=com.mysql.cj.jdbc.Driver
app.datasource.identity.url=${IDENTITY_DB_URL:jdbc:mysql://localhost:3306/identity_db?characterEncoding=UTF-8&serverTimezone=UTC}
app.datasource.identity.username=${IDENTITY_DB_USERNAME}
app.datasource.identity.password=${IDENTITY_DB_PASSWORD}

app.datasource.community.driver-class-name=com.mysql.cj.jdbc.Driver
app.datasource.community.url=${COMMUNITY_DB_URL:jdbc:mysql://localhost:3306/community_db?characterEncoding=UTF-8&serverTimezone=UTC}
app.datasource.community.username=${COMMUNITY_DB_USERNAME}
app.datasource.community.password=${COMMUNITY_DB_PASSWORD}

app.datasource.chat.driver-class-name=com.mysql.cj.jdbc.Driver
app.datasource.chat.url=${CHAT_DB_URL:jdbc:mysql://localhost:3306/chat_db?characterEncoding=UTF-8&serverTimezone=UTC}
app.datasource.chat.username=${CHAT_DB_USERNAME}
app.datasource.chat.password=${CHAT_DB_PASSWORD}

app.datasource.facility.driver-class-name=com.mysql.cj.jdbc.Driver
app.datasource.facility.url=${FACILITY_DB_URL:jdbc:mysql://localhost:3306/facility_db?characterEncoding=UTF-8&serverTimezone=UTC}
app.datasource.facility.username=${FACILITY_DB_USERNAME}
app.datasource.facility.password=${FACILITY_DB_PASSWORD}

app.datasource.favorite.driver-class-name=com.mysql.cj.jdbc.Driver
app.datasource.favorite.url=${FAVORITE_DB_URL:jdbc:mysql://localhost:3306/favorite_db?characterEncoding=UTF-8&serverTimezone=UTC}
app.datasource.favorite.username=${FAVORITE_DB_USERNAME}
app.datasource.favorite.password=${FAVORITE_DB_PASSWORD}

# 각 모듈이 명시적으로 생성한 Flyway Bean을 사용한다.
spring.flyway.enabled=false
# Redis 설정
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
vworld.api.key=${API_KEY}
# JWT 설정
application.security.jwt.secret=${JWT_SECRET}
application.security.jwt.access-token-expiration=1800000
application.security.jwt.refresh-token-expiration=604800000
application.security.cookie.secure=${COOKIE_SECURE:false}
# 카카오 지도 API 설정
kakao.map.api-key=${KAKAO_MAP_API_KEY}
