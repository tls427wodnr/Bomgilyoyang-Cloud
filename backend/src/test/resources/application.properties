spring.application.name=neulbomgil-backend-test
server.port=8088
# 테스트에서도 모듈마다 독립된 인메모리 데이터베이스를 사용한다.
app.datasource.identity.driver-class-name=org.h2.Driver
app.datasource.identity.url=jdbc:h2:mem:identity_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=FALSE
app.datasource.identity.username=sa
app.datasource.identity.password=

app.datasource.community.driver-class-name=org.h2.Driver
app.datasource.community.url=jdbc:h2:mem:community_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=FALSE
app.datasource.community.username=sa
app.datasource.community.password=

app.datasource.chat.driver-class-name=org.h2.Driver
app.datasource.chat.url=jdbc:h2:mem:chat_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=FALSE
app.datasource.chat.username=sa
app.datasource.chat.password=

app.datasource.facility.driver-class-name=org.h2.Driver
app.datasource.facility.url=jdbc:h2:mem:facility_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=FALSE
app.datasource.facility.username=sa
app.datasource.facility.password=

app.datasource.favorite.driver-class-name=org.h2.Driver
app.datasource.favorite.url=jdbc:h2:mem:favorite_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=FALSE
app.datasource.favorite.username=sa
app.datasource.favorite.password=

spring.flyway.enabled=false
# 외부 API Key 설정
vworld.api.key=test_vworld_api_key_placeholder
# JWT 설정
application.security.jwt.secret=abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_neulbomgil_test_secret_key_32bytes
application.security.jwt.access-token-expiration=1800000
application.security.jwt.refresh-token-expiration=604800000
application.security.cookie.secure=false
# 카카오 지도 설정
kakao.map.api-key=test_kakao_map_api_key
# 서버 URL 설정
url.location=localhost
